<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Test Crypto.gs</title>
</head>
<body>
<pre id="out">running...</pre>
<script src="apps-script/Crypto.gs"></script>
<script>
// Test vector SHA-256("abc") =
// ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
// SHA-256("") =
// e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
var cases = [];
function check(name, actual, expected) {
  var ok = actual === expected;
  cases.push((ok ? 'PASS' : 'FAIL') + ' | ' + name + (ok ? '' : '\n   got: ' + actual + '\n   exp: ' + expected));
}

check('sha256("abc")', bytesToHex(sha256(utf8Bytes('abc'))),
  'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad');
check('sha256("")', bytesToHex(sha256(utf8Bytes(''))),
  'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855');
check('sha256(55 chars "a")', bytesToHex(sha256(utf8Bytes('aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'))),
  '9f4390f8d30c2dd92ec9f095b65e2b9ae9b0a925a5258e241c9f1e910f734318');

// HMAC-SHA256 RFC 4231 test case 1: key = 20x 0x0b, data = "Hi There"
var k1 = new Uint8Array(20); for (var i = 0; i < 20; i++) k1[i] = 0x0b;
check('hmac rfc4231#1', bytesToHex(hmacSha256(k1, utf8Bytes('Hi There'))),
  'b0344c61d8db38535ca8afceaf0bf12b881dc200c9833da726e9376c2e32cff7');

// HMAC RFC 4231 case 2: key="Jefe", data="what do ya want for nothing?"
check('hmac rfc4231#2', bytesToHex(hmacSha256(utf8Bytes('Jefe'), utf8Bytes('what do ya want for nothing?'))),
  '5bdcc146bf60754e6a042426089575c75a003f089d2739839dec58b964ec3843');

// PBKDF2-HMAC-SHA256 (nilai referensi dari Python hashlib.pbkdf2_hmac)
// password="password" salt="salt"
check('pbkdf2 c=1 dk=20', pbkdf2Sha256('password', '73616c74', 1, 20),
  '120fb6cffcf8b32c43e7225256c4f837a86548c9');
check('pbkdf2 c=2 dk=20', pbkdf2Sha256('password', '73616c74', 2, 20),
  'ae4d0c95af6b46d32d0adff928f06dd02a303f8e');
check('pbkdf2 c=4096 dk=20', pbkdf2Sha256('password', '73616c74', 4096, 20),
  'c5e478d59288c841aa530db6845c4c8d962893a0');

// Kompatibilitas dengan tools/hash_password.py (pbkdf2$ITER$SALT_HEX$HASH_HEX)
check('pbkdf2 c=10000 salt=73616c74 dk=32', pbkdf2Sha256('password', '73616c74', 10000, 32),
  '5ec02b91a4b59c6f59dd5fbe4ca649ece4fa8568cdb8ba36cf41426e8805522b');

var failed = cases.filter(function(c) { return c.indexOf('FAIL') === 0; }).length;
document.getElementById('out').textContent =
  cases.join('\n') + '\n\n=== ' + (cases.length - failed) + '/' + cases.length + ' passed ===';
</script>
</body>
</html>
