<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Tugas MBP</title>
  <link rel="stylesheet" href="css/app.css?v=702d6abd24" />
</head>
<body class="min-h-screen bg-surface-2 text-body antialiased">

  <!-- HEADER: identitas unit -->
  <header class="sticky top-0 z-30 bg-surface border-b border-line">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p id="mobileUnitName" class="text-sm font-bold text-body truncate leading-tight">Memuat</p>
        <p id="mobileOrderId" class="text-[11px] font-mono text-faint truncate leading-tight">-</p>
      </div>
      <span id="mobilePriorityBadge" class="px-2 py-0.5 rounded text-[11px] font-semibold bg-surface-3 text-muted border border-line shrink-0">Low</span>
    </div>
  </header>

  <!-- ISI: tujuan + status + 1 tombol -->
  <main class="max-w-md mx-auto px-4 py-4 pb-28 space-y-2.5">

    <!-- Site tujuan -->
    <section class="bg-surface border border-line rounded-xl p-4">
      <p class="text-[10px] font-semibold uppercase tracking-wider text-faint">Site Tujuan</p>
      <h1 id="mobileSiteDest" class="text-2xl font-bold text-body leading-tight mt-1 break-words">-</h1>
      <p id="mobileEtaVal" class="text-xs font-mono text-amber-700 mt-1 tabular">-</p>
    </section>

    <!-- Status + timer (1 baris) -->
    <section class="bg-surface border border-line rounded-xl px-4 py-3 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <span id="mobileCurrentStatusBadge"></span>
      </div>
      <div class="text-right shrink-0">
        <span id="timerTitle" class="text-[10px] uppercase tracking-wider text-faint block">Durasi Idle</span>
        <p id="mobileLiveTimer" class="text-base font-bold text-body tabular leading-tight">00m 00s</p>
      </div>
    </section>

    <!-- Tombol aksi (sticky di bawah) -->
    <div class="fixed bottom-0 left-0 right-0 z-30 bg-surface-2 border-t border-line px-4 py-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
      <div class="max-w-md mx-auto">
        <button onclick="handleMbpAction()" id="btnMbpAction"
                class="status-btn w-full py-3.5 px-4 rounded-xl border-2 border-amber-500 bg-amber-500 text-slate-950 flex items-center justify-center transition-colors">
          <span data-btn-label class="font-bold text-base leading-tight">Terima &amp; OTW</span>
        </button>
        <p data-btn-hint class="hidden"></p>
        <p id="mobileSyncFeedback" class="hidden text-center text-xs font-medium text-emerald-700 mt-2">Tersimpan</p>
      </div>
    </div>
  </main>

  <!-- Overlay selesai: teknisi tidak bisa login manual, jadi tanpa form -->
  <div id="loginScreen" class="fixed inset-0 z-[60] bg-surface-2 flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-sm bg-surface border border-line rounded-xl p-6 text-center">
      <h1 class="font-bold text-base text-body">Tugas Selesai</h1>
      <p id="loginError" class="text-sm text-muted mt-1"></p>
      <p class="text-xs text-faint mt-3">Silakan tutup halaman ini.</p>
    </div>
  </div>

  <script defer src="js/config.js?v=a08166c8d7"></script>
  <script defer src="js/auth.js?v=c7c6a81004"></script>
  <script defer src="js/app.js?v=9d1dc186fa"></script>
</body>
</html>
